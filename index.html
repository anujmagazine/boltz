<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {

    display: block; width: 224px; height: 256px; image-rendering: pixelated; image-rendering: crisp-edges;

  }

  #hint b { color: #b8c7dd; font-weight: 600; }

  #pad {
    --dp: min(150px, 39vw); --jb: min(100px, 26vw);
    flex: none; height: calc(var(--dp) + 44px); display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px max(12px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  @media (orientation: portrait) and (pointer: coarse) { #stage { align-items: flex-end; } }
  #dpad {
    position: relative; width: var(--dp); height: var(--dp); border-radius: 50%; flex: none;
    background: radial-gradient(circle at 50% 40%, #232c52, #111733 70%);
    box-shadow: inset 0 0 0 3px #2f3a6b, 0 6px 0 #05070f; touch-action: none;
  }
  #dpad .a { position: absolute; width: 0; height: 0; border-style: solid; opacity: .75; }
  #dpad .up    { left: 50%; top: 10%;    transform: translateX(-50%); border-width: 0 17px 24px 17px; border-color: transparent transparent #b8c7dd transparent; }
  #dpad .down  { left: 50%; bottom: 10%; transform: translateX(-50%); border-width: 24px 17px 0 17px; border-color: #b8c7dd transparent transparent transparent; }
  #dpad .left  { top: 50%; left: 10%;    transform: translateY(-50%); border-width: 17px 24px 17px 0; border-color: transparent #b8c7dd transparent transparent; }

  #dpad.u .up    { border-bottom-color: #ffb000; opacity: 1; }
  #dpad.d .down  { border-top-color: #ffb000; opacity: 1; }
  #dpad.l .left  { border-right-color: #ffb000; opacity: 1; }
  #dpad.r .right { border-left-color: #ffb000; opacity: 1; }
  #dpad .hub { position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; transform: translate(-50%, -50%); border-radius: 50%; background: #0b1026; box-shadow: inset 0 0 0 2px #2f3a6b; }

  #jump {
    width: var(--jb); height: var(--jb); border-radius: 50%; flex: none;

  }

  @media (hover: hover) and (pointer: fine) {
    #pad { display: none; }

  }
  @media (orientation: landscape) and (pointer: coarse) {
    #pad { position: absolute; inset: 0; height: auto; padding: 0; pointer-events: none; }

    #jump { position: absolute; right: calc(24px + env(safe-area-inset-right)); bottom: calc(36px + env(safe-area-inset-bottom)); pointer-events: auto; }

<body>
<div id="app">
  <div id="stage"><canvas id="c" aria-label="BOLTZ! game screen"></canvas></div>

<script>
(function () {
'use strict';

/* ================================================================
   BOLTZ! — an original arcade climber.
   Boltz the robot has nabbed Sparky the dog. Climb the shipyard
   gantry, dodge oil drums, crates, sparks and bouncing nuts.
   ================================================================ */

const W = 224, H = 256, S = 4;           // logical screen, internal render scale
const FOOT = 2, GRAV = 0.16, JUMP_V = -2.15, MAXFALL = 3.2, FALL_DEATH = 22, WALK = 1.0, CLIMB = 0.8;
const FONT = '"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
const C = {
  bg: '#070b1e', girder: '#ffb000', girderHi: '#ffd36b', ladder: '#b8c7dd', white: '#ffffff',
  cyan: '#58e1ff', red: '#ff3b6b', dim: '#5d6688', yellow: '#ffe066', soft: '#9aa4c7'
};

const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.random;
const pad6 = n => String(Math.floor(n)).padStart(6, '0');
const isTouch = matchMedia('(pointer: coarse)').matches;
let uid = 0;

function txt(s, x, y, col, align, size) {
  ctx.font = (size || 8) + 'px ' + FONT;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function txtS(s, x, y, col, align, size, sh) {
  const o = (size || 8) >= 16 ? 2 : 1;
  txt(s, x + o, y + o, sh || '#000', align, size); txt(s, x, y, col, align, size);
}

/* ---------------- pixel sprites ---------------- */
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const mk = flip => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x]; if (ch === '.' || !pal[ch]) continue;
        g.fillStyle = pal[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
      }
    });
    return c;
  };
  return { r: mk(false), l: mk(true), w, h };
}
function spr(s, x, y, flip) { ctx.drawImage(flip ? s.l : s.r, Math.round(x), Math.round(y)); }

const HP = { H: '#ff7a1a', h: '#b84a00', V: '#58e1ff', S: '#f2b880', O: '#18b38a', o: '#0b6b55', B: '#6b3b16', W: '#eef2f7', Y: '#ffd23f' };
const TOP = [
  '....HHHH....',
  '...HHHHHHH..',
  '..HHHHHYYH..',
  '..hhhhhhhhhh',
  '...SSSVVVV..',
  '...SSSVVVV..',
  '....SSSSS...',
  '...OOYYOO...',
  '..OOOOOOOO..',
  '.WOOOOOOOOW.',
  '.WWOoOOoOWW.'
];
const HERO = {
  stand: sprite(TOP.concat(['...OOOOOO...', '...OOO.OOO..', '...OO...OO..', '..BBB..BBB..', '..BBB..BBBB.']), HP),
  w1:    sprite(TOP.concat(['...OOOOOO...', '..OOO..OOO..', '.OO......OO.', 'BBB......BBB', 'BB........BB']), HP),
  w2:    sprite(TOP.concat(['...OOOOOO...', '....OOOO....', '....OOO.....', '....BBBB....', '....BBBBB...']), HP),
  jump:  sprite(TOP.concat(['..OOOOOOO...', '.OOO...OOO..', 'BBB.....BBB.', 'BB.......BB.', '............']), HP),
  climb: sprite([
    '....HHHH....',
    '...HHHHHH...',
    '..HHHHHHHH..',
    '..hhhhhhhh..',
    'W..SSSSSS..W',
    'WO..SSSS..OW',
    '.OO.OOOO.OO.',
    '..OOOOOOOO..',
    '...OOOOOO...',
    '...OYOOYO...',
    '...oOOOOo...',
    '...OOOOOO...',
    '...OO..OO...',
    '...OO..OO...',
    '..BBB...OO..',
    '..BB....BBB.'
  ], HP)
};
const DP = { w: '#f5f5f5', b: '#a0662f', k: '#111111', R: '#ff3b6b' };
const DOG1 = sprite([
  '..b...........',
  '.bwb..........',
  'kwwwb.........',
  '.wwwwRwwwwwwb.',
  '..wwwRwbbwwwwb',
  '...wwwwbbwww..',
  '...wwwwwwwww..',
  '...w.w...w.w..',
  '...w.w...w.w..'
], DP);
const DOG2 = sprite([
  '..b...........',
  '.bwb..........',
  'kwwwb.........',
  '.wwwwRwwwwww..',
  '..wwwRwbbwwwww',
  '...wwwwbbwwwb.',
  '...wwwwwwwww..',
  '...w.w...w.w..',
  '....w.w...w.w.'
], DP);
const HEART = sprite(['.RR.RR.', 'RRRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'], { R: '#ff3b6b' });

const STARS = Array.from({ length: 46 }, () => [Math.floor(rnd() * W), Math.floor(30 + rnd() * (H - 40)), rnd() < 0.3]);

/* ---------------- audio (all synthesized) ---------------- */
let actx = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem('gp_muted') === '1'; } catch (e) {}
function unlockAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.5), actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    } catch (e) { actx = null; return; }
  }
  if (actx.state === 'suspended') actx.resume();
}
function tone(f, d, type, v, to, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v || 0.08, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, v, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = noiseBuf;
  g.gain.setValueAtTime(v || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d);
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const sfx = {
  jump()   { tone(330, 0.12, 'square', 0.07, 660); },
  land()   { tone(140, 0.04, 'triangle', 0.08); },
  step()   { tone(180, 0.025, 'square', 0.022); },
  climb()  { tone(260, 0.03, 'square', 0.025); },
  score()  { tone(988, 0.06, 'square', 0.06); tone(1319, 0.08, 'square', 0.06, null, 0.06); },
  smash()  { noise(0.15, 0.15); tone(220, 0.15, 'sawtooth', 0.07, 55); },
  pickup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.07, 'square', 0.06, null, i * 0.06)); },
  bolt()   { tone(1047, 0.05, 'square', 0.07); tone(1568, 0.08, 'square', 0.07, null, 0.05); },
  die()    { for (let i = 0; i < 8; i++) tone(700 - i * 70, 0.1, 'square', 0.08, null, i * 0.1); noise(0.3, 0.08, 0.85); },
  clear()  { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.12, 'square', 0.07, null, i * 0.11)); },
  throw()  { tone(110, 0.12, 'triangle', 0.14, 60); },
  thud()   { tone(90, 0.05, 'triangle', 0.06); },
  boing()  { tone(300, 0.09, 'sine', 0.04, 700); },
  drop()   { tone(600, 0.25, 'square', 0.04, 150); },
  fire()   { noise(0.2, 0.06); },
  start()  { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.07, null, i * 0.08)); },
  over()   { [523, 392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, null, i * 0.2)); },
  life()   { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.08, 'square', 0.07, null, i * 0.07)); },
  warn()   { tone(1200, 0.05, 'square', 0.04); }
};
const TUNES = {
  ramps:  [45, 57, 52, 57, 45, 57, 52, 59, 43, 55, 50, 55, 43, 55, 50, 57],
  belts:  [48, 48, 55, 48, 51, 51, 58, 51, 46, 46, 53, 46, 50, 50, 55, 53],
  lifts:  [40, 52, 47, 52, 41, 53, 48, 53, 43, 55, 50, 55, 41, 53, 48, 52],
  bolts:  [45, 0, 45, 57, 0, 45, 55, 57, 43, 0, 43, 55, 0, 43, 53, 55],
  mallet: [57, 64, 69, 64, 57, 64, 69, 72]
};
function musicTick() {
  if (!actx || muted) return;
  const ham = pl.mallet > 0, tune = ham ? TUNES.mallet : TUNES[st.type], stepF = ham ? 8 : 12;
  if (st.frame % stepF === 0) {
    const n = tune[Math.floor(st.frame / stepF) % tune.length];
    if (n) tone(midi(n), stepF / 60 * 0.9, 'triangle', 0.045);
  }
}

/* ---------------- game state ---------------- */
const game = { state: 'title', t: 0, score: 0, hi: 0, hiAtStart: 0, lives: 3, level: 1, stageIdx: 0, extra: false, newHi: false };
try { game.hi = +localStorage.getItem('gp_hi') || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('gp_hi', String(game.hi)); } catch (e) {} }

let st = null, pl = null, diff = null;

const NAMES = { ramps: 'THE RAMPS', belts: 'THE BELTS', lifts: 'THE LIFTS', bolts: 'THE BOLTS' };
const TIPS  = { ramps: 'JUMP THE OIL DRUMS', belts: 'MIND THE CRATES', lifts: 'RIDE THE LIFTS UP', bolts: 'PULL ALL 8 BOLTS' };
function stageList(level) {
  if (level === 1) return ['ramps', 'bolts'];
  if (level === 2) return ['ramps', 'lifts', 'bolts'];
  if (level === 3) return ['ramps', 'belts', 'lifts', 'bolts'];
  return ['ramps', 'belts', 'ramps', 'lifts', 'bolts'];
}
function makeDiff() {
  const d = Math.min(game.level, 8);
  return {
    d,
    throwEvery: Math.max(64, 150 - d * 11),
    drumSpeed: Math.min(1.6, 0.9 + d * 0.08),
    ladderP: 0.18 + d * 0.04,
    sparkSpeed: Math.min(0.75, 0.36 + d * 0.045),
    sparkMax: Math.min(5, 2 + Math.floor(d / 2)),
    crateEvery: Math.max(70, 190 - d * 14),
    springEvery: Math.max(72, 150 - d * 9),
    springSpeed: Math.min(1.5, 0.95 + d * 0.06),
    liftSpeed: Math.min(0.85, 0.5 + d * 0.04),
    robotSpeed: 0.3 + d * 0.04,
    beltMul: 1 + d * 0.06
  };
}

/* ---------------- geometry ---------------- */
function P(x1, y1, x2, y2, o) {
  return Object.assign({ x1, y1, x2, y2, kind: 'girder', alive: true, belt: 0, down: y1 > y2 ? -1 : (y2 > y1 ? 1 : 0) }, o || {});
}
function surf(p, x) {
  if (p.x2 === p.x1 || p.y1 === p.y2) return p.y1;
  const t = clamp((x - p.x1) / (p.x2 - p.x1), 0, 1);
  return p.y1 + (p.y2 - p.y1) * t;
}
function L(x, lo, up) { return { x, top: surf(up, x), bottom: surf(lo, x) }; }
function support(x, y, tol, enemy) {
  let best = null, bd = 1e9;
  for (const p of st.plats) {
    if (!p.alive || (enemy && p.kind === 'lift')) continue;
    if (x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const d = Math.abs(surf(p, x) - y);
    if (d <= tol && d < bd) { bd = d; best = p; }
  }
  return best;
}
// Player-only: like support(), but also lets you step UP onto a ledge up to 8px higher (friendlier lift exits).
function stepSupport(x, y) {
  let best = null, bd = 1e9;
  for (const p of st.plats) {
    if (!p.alive || x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const s = surf(p, x), d = s - y;
    if (d >= -8 && d <= 3.5 && Math.abs(d) < bd) { bd = Math.abs(d); best = p; }
  }
  return best;
}
function landing(x, y0, y1, enemy) {
  let best = null, bs = 1e9;
  for (const p of st.plats) {
    if (!p.alive || (enemy && p.kind === 'lift')) continue;
    if (x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const s = surf(p, x);
    if (s >= y0 - 1.5 && s <= y1 + 0.5 && s < bs) { bs = s; best = p; }
  }
  return best;
}
const hit = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
function ebox(e) {
  const hw = e.type === 'drum' ? 5 : 4, h = e.type === 'drum' ? 10 : 9;
  return { x1: e.x - hw + 1, x2: e.x + hw - 1, y1: e.y - h + 1, y2: e.y - 1 };
}

/* ---------------- stage builders ---------------- */
const BUILD = {
  ramps() {
    const g = [P(0, 248, 224, 240), P(0, 212, 208, 220), P(16, 188, 224, 180), P(0, 152, 208, 160), P(16, 128, 224, 120), P(0, 92, 208, 100), P(72, 64, 136, 64)];
    return {
      plats: g,
      ladders: [L(180, g[0], g[1]), L(88, g[0], g[1]), L(40, g[1], g[2]), L(120, g[1], g[2]), L(168, g[2], g[3]), L(96, g[2], g[3]),
                L(40, g[3], g[4]), L(136, g[3], g[4]), L(184, g[4], g[5]), L(104, g[4], g[5]), L(124, g[5], g[6])],
      goal: g[6], start: { x: 56, y: surf(g[0], 56) },
      robot: { x: 24, y: surf(g[5], 24), pose: 'idle', t: diff.throwEvery - 70, throwAnim: 0 },
      dog: { x: 96, y: 64 },
      mallets: [{ x: 28, y: surf(g[1], 28) - 6 }, { x: 196, y: surf(g[4], 196) - 6 }],
      furnaceLit: false, fire: 0
    };
  },
  belts() {
    const m = diff.beltMul;
    const F0 = P(0, 248, 224, 248), F1 = P(16, 208, 208, 208, { kind: 'belt', belt: 0.45 * m });
    const F2a = P(0, 168, 96, 168, { kind: 'belt', belt: 0.5 * m }), F2b = P(128, 168, 224, 168, { kind: 'belt', belt: -0.5 * m });
    const F3a = P(0, 128, 96, 128, { kind: 'belt', belt: -0.5 * m }), F3b = P(128, 128, 224, 128, { kind: 'belt', belt: 0.5 * m });
    const F4 = P(8, 96, 216, 96), F5 = P(64, 48, 160, 48);
    return {
      plats: [F0, F1, F2a, F2b, F3a, F3b, F4, F5],
      ladders: [L(32, F0, F1), L(192, F0, F1), L(56, F1, F2a), L(168, F1, F2b), L(72, F2a, F3a), L(152, F2b, F3b),
                L(24, F3a, F4), L(200, F3b, F4), L(76, F4, F5), L(148, F4, F5)],
      goal: F5, start: { x: 40, y: 248 },
      robot: { x: 112, y: 96, dir: 1, minX: 92, maxX: 132, pose: 'idle' },
      dog: { x: 112, y: 48 },
      mallets: [{ x: 140, y: 202 }, { x: 40, y: 122 }],
      crateSpawns: [{ p: F2a, x: 4, t: 60 }, { p: F2b, x: 220, t: 150 }, { p: F3a, x: 92, t: 100 }, { p: F3b, x: 132, t: 200 }],
      sparkPts: [[180, 208], [30, 168], [200, 168], [40, 96], [190, 96]],

  lifts() {

      goal: D, start: { x: 16, y: 248 },

    plats.push(P(40, 72, 184, 72));
    const lad = [[28, 248, 216], [108, 248, 216], [196, 248, 216], [68, 216, 180], [152, 216, 180],
                 [28, 180, 144], [112, 180, 144], [196, 180, 144], [68, 144, 108], [152, 144, 108]]
      .map(([x, b, t]) => ({ x, top: t, bottom: b }));

      robot: { x: 120, y: 72, dir: 1, minX: 100, maxX: 150, pose: 'idle' },

      sparkPts: [[20, 216], [204, 216], [20, 180], [204, 180], [20, 144], [204, 144], [20, 108], [204, 108]],
      sparkMax: Math.min(5, 2 + Math.floor(diff.d / 2)), sparkT: 0, sparkEvery: 360,

function buildStage(type) {
  diff = makeDiff();
  st = BUILD[type]();
  Object.assign(st, { type, drums: [], sparks: [], crates: [], springs: [], fx: [], pops: [], frame: 0,
    bonus: Math.min(5000 + 1000 * (game.level - 1), 8000) });
  pl = { x: st.start.x, y: st.start.y, dir: 1, state: 'walk', ground: null, anim: 0, mallet: 0,
         vy: 0, jvx: 0, peak: st.start.y, jumped: false, scored: new Set(), deadT: 0, ladder: null };
  pl.ground = support(pl.x, pl.y, 3);
  (st.initSparks || []).forEach(([x, y]) => spawnSpark(x, y, 99));
}
function spawnSpark(x, y, born) {
  const g = support(x, y, 3, true);
  st.sparks.push({ id: ++uid, type: 'spark', x, y: g ? surf(g, x) : y, dir: x < W / 2 ? 1 : -1, state: 'walk',
                   ground: g, lastL: null, born: born || 0, vy: 0 });
}

/* ---------------- flow ---------------- */
function newGame() {
  Object.assign(game, { score: 0, lives: 3, level: 1, stageIdx: 0, extra: false, newHi: false, hiAtStart: game.hi });
  sfx.start(); startIntro();
}
function startIntro() { game.state = 'intro'; game.t = 0; buildStage(stageList(game.level)[game.stageIdx]); }
function addScore(n, x, y) {
  game.score += n;
  if (game.score > game.hi) game.hi = game.score;
  if (x != null) st.pops.push({ x, y, txt: String(n), t: 0 });
  if (!game.extra && game.score >= 10000) { game.extra = true; game.lives++; sfx.life(); }
}
function killPlayer() {
  if (game.state !== 'play') return;
  game.state = 'dying'; pl.state = 'dead'; pl.deadT = 0; sfx.die();
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(120); } catch (e) {}
}
function stageClear() {
  game.state = 'clear'; game.t = 0; pl.mallet = 0; st.clearBonus = st.bonus;
  addScore(st.bonus); saveHi(); sfx.clear();
  if (st.type === 'bolts') {
    st.robot.falling = true; st.robot.vy = 0; st.robot.pose = 'fall';
    pl.x = st.dog.x + 16; pl.y = 72; pl.state = 'walk'; pl.dir = -1; pl.anim = 0;
  }
}
function togglePause() {
  if (game.state === 'play') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'play';
}

/* ---------------- input ---------------- */
const keys = { left: false, right: false, up: false, down: false, jump: false };
let jumpBuf = 0, startQueued = false;
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
                 ArrowDown: 'down', KeyS: 'down', Space: 'jump', KeyZ: 'jump', KeyX: 'jump', KeyK: 'jump' };
function onStart() {
  unlockAudio();
  if (game.state === 'title' || game.state === 'over') startQueued = true;
  else if (game.state === 'play' || game.state === 'paused') togglePause();
}
function toggleMute() {
  muted = !muted; unlockAudio();
  try { localStorage.setItem('gp_muted', muted ? '1' : '0'); } catch (e) {}
  document.getElementById('bMute').textContent = muted ? 'SOUND OFF' : 'SOUND ON';
}
document.getElementById('bMute').textContent = muted ? 'SOUND OFF' : 'SOUND ON';

addEventListener('keydown', e => {
  unlockAudio();
  const k = keyMap[e.code];
  if (k) { if (k === 'jump' && !keys.jump) jumpBuf = 8; keys[k] = true; e.preventDefault(); }
  if (e.code === 'Enter') { onStart(); e.preventDefault(); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') togglePause(); });
addEventListener('contextmenu', e => e.preventDefault());

const dpad = document.getElementById('dpad');
let dpadId = null;
function dpadSet(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), t = r.width * 0.12;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  const horiz = ax > t && ax > ay * 0.6, vert = ay > t && ay > ax * 0.6;
  keys.left = horiz && dx < 0; keys.right = horiz && dx > 0; keys.up = vert && dy < 0; keys.down = vert && dy > 0;
  dpadVis();
}
function dpadVis() {
  dpad.classList.toggle('u', keys.up); dpad.classList.toggle('d', keys.down);
  dpad.classList.toggle('l', keys.left); dpad.classList.toggle('r', keys.right);
}
dpad.addEventListener('pointerdown', e => { unlockAudio(); dpadId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} dpadSet(e); e.preventDefault(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadId) dpadSet(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => dpad.addEventListener(ev, e => {
  if (e.pointerId === dpadId) { dpadId = null; keys.left = keys.right = keys.up = keys.down = false; dpadVis(); }
}));
const jb = document.getElementById('jump');
jb.addEventListener('pointerdown', e => {
  unlockAudio(); e.preventDefault(); try { jb.setPointerCapture(e.pointerId); } catch (_) {}
  keys.jump = true; jumpBuf = 8; jb.classList.add('on');
  if (game.state === 'title' || game.state === 'over') startQueued = true;
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => jb.addEventListener(ev, () => { keys.jump = false; jb.classList.remove('on'); }));
document.getElementById('bStart').addEventListener('click', onStart);
document.getElementById('bMute').addEventListener('click', toggleMute);
cv.addEventListener('pointerdown', () => {
  unlockAudio();
  if (game.state === 'title' || game.state === 'over') startQueued = true;
  else if (game.state === 'paused') togglePause();
});

/* ---------------- updates ---------------- */
function updatePlayer() {
  const p = pl;
  if (p.mallet > 0) p.mallet--;
  const h = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  if (p.state === 'climb') {
    const l = p.ladder; let moved = false;
    if (keys.up) { p.y -= CLIMB; moved = true; if (p.y <= l.top) { p.y = l.top; p.state = 'walk'; p.ground = support(p.x, p.y, 3); } }
    else if (keys.down) { p.y += CLIMB; moved = true; if (p.y >= l.bottom) { p.y = l.bottom; p.state = 'walk'; p.ground = support(p.x, p.y, 3); } }
    if (moved) { p.anim++; if (p.anim % 10 === 0) sfx.climb(); }
    if (p.state === 'walk') p.anim = 0;
    return;
  }

  if (p.state === 'walk') {
    if (!p.mallet) {
      if (keys.up) {
        const l = st.ladders.find(l => Math.abs(p.x - l.x) <= 4 && Math.abs(p.y - l.bottom) <= 3);
        if (l) { p.state = 'climb'; p.ladder = l; p.x = l.x; p.anim = 0; return; }
      }
      if (keys.down) {
        const l = st.ladders.find(l => Math.abs(p.x - l.x) <= 4 && Math.abs(p.y - l.top) <= 3);
        if (l) { p.state = 'climb'; p.ladder = l; p.x = l.x; p.y += 1; p.anim = 0; return; }
      }
    }
    if (h) p.dir = h;
    const g = p.ground, belt = g && g.kind === 'belt' ? g.belt : 0;
    if (jumpBuf > 0 && !p.mallet) {
      jumpBuf = 0; p.state = 'air'; p.vy = JUMP_V; p.jvx = h * WALK + belt * 0.5;
      p.peak = p.y; p.jumped = true; p.scored = new Set(); sfx.jump(); return;
    }
    const nx = clamp(p.x + h * WALK + belt, 4, W - 4);
    const s = stepSupport(nx, p.y);
    p.x = nx;
    if (s) { p.ground = s; p.y = surf(s, p.x); }
    else { p.state = 'air'; p.vy = 0; p.jvx = 0; p.peak = p.y; p.jumped = false; p.ground = null; }
    if (h) { p.anim++; if (p.anim % 9 === 0) sfx.step(); } else p.anim = 0;
    return;
  }

  if (p.state === 'air') {
    p.vy = Math.min(p.vy + GRAV, MAXFALL);
    p.x = clamp(p.x + p.jvx, 4, W - 4);
    const ny = p.y + p.vy;
    if (p.vy > 0) {
      const s = landing(p.x, p.y, ny);
      if (s) {
        p.y = surf(s, p.x); p.state = 'walk'; p.ground = s; p.anim = 0;
        if (p.y - p.peak > FALL_DEATH) killPlayer(); else sfx.land();
        return;
      }
    }
    p.y = ny; if (p.y < p.peak) p.peak = p.y;
  }
}

function furnaceHit() {
  st.furnaceLit = true; st.fire = 30; sfx.fire();
  if (st.sparks.length < diff.sparkMax) spawnSpark(24, surf(st.plats[0], 24), 0);
}

function updateDrum(d) {
  if (d.state === 'ladder') {
    d.y += 1.2;
    if (d.y >= d.ladder.bottom) {
      d.y = d.ladder.bottom; const g = support(d.x, d.y, 3, true);
      d.ground = g; d.state = 'roll'; d.dir = (g && g.down) || -d.dir; d.lastL = d.ladder;
    }
    return;
  }
  if (d.state === 'fall') {
    d.vy = Math.min(d.vy + GRAV, MAXFALL); d.x += d.dir * 0.5;
    const ny = d.y + d.vy, g = d.vy > 0 ? landing(d.x, d.y, ny, true) : null;
    if (g) { d.y = surf(g, d.x); d.ground = g; d.state = 'roll'; d.dir = g.down || -d.dir; d.lastL = null; sfx.thud(); }
    else d.y = ny;
    if (d.y > H + 12) d.dead = true;
    return;
  }
  const px = d.x;
  d.x += d.dir * diff.drumSpeed; d.rot += d.dir * diff.drumSpeed;
  const g = support(d.x, d.y, 3, true);
  if (!g) { d.state = 'fall'; d.vy = 0; return; }
  d.ground = g; d.y = surf(g, d.x);
  if (st.type === 'ramps' && g === st.plats[0] && d.x <= 22) { d.dead = true; furnaceHit(); return; }
  if (d.lastL && Math.abs(d.x - d.lastL.x) > 8) d.lastL = null;
  for (const l of st.ladders) {
    if (l === d.lastL || (px - l.x) * (d.x - l.x) > 0) continue;
    if (Math.abs(l.top - d.y) < 3) {
      d.lastL = l;
      let pr = diff.ladderP; if (pl.y > d.y + 8 && Math.abs(pl.x - l.x) < 48) pr += 0.25;
      if (rnd() < pr) { d.state = 'ladder'; d.ladder = l; d.x = l.x; }
      break;
    }
  }
}

function updateSpark(s) {
  s.born++;
  if (s.state === 'fall') {
    s.vy = Math.min(s.vy + GRAV, MAXFALL);
    const ny = s.y + s.vy, g = landing(s.x, s.y, ny, true);
    if (g) { s.y = surf(g, s.x); s.state = 'walk'; s.ground = g; } else s.y = ny;
    if (s.y > H + 10) s.dead = true;
    return;
  }
  if (s.state === 'climb') {
    const l = s.ladder; s.y += s.cdir * diff.sparkSpeed * 0.8;
    if (s.cdir < 0 && s.y <= l.top) { s.y = l.top; s.state = 'walk'; s.lastL = l; s.dir = rnd() < 0.5 ? 1 : -1; }
    else if (s.cdir > 0 && s.y >= l.bottom) { s.y = l.bottom; s.state = 'walk'; s.lastL = l; s.dir = rnd() < 0.5 ? 1 : -1; }
    return;
  }
  if (!support(s.x, s.y, 3, true)) { s.state = 'fall'; s.vy = 0; return; }
  if (rnd() < 0.004) s.dir *= -1;
  if (rnd() < 0.02 && Math.abs(pl.y - s.y) < 6) s.dir = pl.x > s.x ? 1 : -1;
  const px = s.x, nx = s.x + s.dir * diff.sparkSpeed, g = support(nx, s.y, 3, true);
  if (!g || nx < 4 || nx > W - 4) { s.dir *= -1; return; }
  s.x = nx; s.y = surf(g, nx); s.ground = g;
  if (s.lastL && Math.abs(s.x - s.lastL.x) > 6) s.lastL = null;
  for (const l of st.ladders) {
    if (l === s.lastL || (px - l.x) * (s.x - l.x) > 0) continue;
    if (Math.abs(l.bottom - s.y) < 3) {
      s.lastL = l;
      if (rnd() < (pl.y < s.y - 6 ? 0.55 : 0.18)) { s.state = 'climb'; s.cdir = -1; s.ladder = l; s.x = l.x; }
      break;
    }
    if (Math.abs(l.top - s.y) < 3) {
      s.lastL = l;
      if (rnd() < (pl.y > s.y + 6 ? 0.55 : 0.18)) { s.state = 'climb'; s.cdir = 1; s.ladder = l; s.x = l.x; }
      break;
    }
  }
}

function updateCrate(c) {
  if (c.state === 'ride') {
    c.x += c.ground.belt;
    if (c.x < c.ground.x1 - 3 || c.x > c.ground.x2 + 3) { c.state = 'fall'; c.vy = 0; c.fx = Math.sign(c.ground.belt) * 0.4; }
    else c.y = c.ground.y1;
  } else {
    c.vy = Math.min(c.vy + GRAV, MAXFALL); c.y += c.vy; c.x += c.fx;
    if (c.y > c.ground.y1 + 34) c.dead = true;
  }
}

function updateSpring(s) {
  if (s.state === 'bounce') {
    s.x += diff.springSpeed; s.ph += 0.13;
    const k = Math.abs(Math.sin(s.ph)); s.y = st.T.y1 - k * 15;
    if (k < 0.13 && !s.tick) { s.tick = true; sfx.boing(); }
    if (k > 0.5) s.tick = false;
    if (s.x >= 214) { s.state = 'drop'; s.x = 216; s.vy = 0.6; sfx.drop(); }
  } else {
    s.vy = Math.min(s.vy + 0.08, 2.4); s.y += s.vy;
    if (s.y > H + 12) s.dead = true;
  }
}

function updateRobot() {
  const r = st.robot; r.f = (r.f || 0) + 1;
  if (st.type === 'ramps') {
    r.t++;
    if (r.throwAnim > 0) { r.throwAnim--; r.pose = 'throw'; }
    else if (r.t >= diff.throwEvery - 28) r.pose = 'hold';
    else r.pose = (Math.floor(st.frame / 20) % 6 === 0) ? 'pound' : 'idle';
    if (r.t >= diff.throwEvery) {
      r.t = 0; r.throwAnim = 16; sfx.throw();
      const g = st.plats[5], x = r.x + 20;
      st.drums.push({ id: ++uid, type: 'drum', x, y: surf(g, x), dir: 1, state: 'roll', ground: g, rot: 0, vy: 0, lastL: null });
    }
  } else if (st.type === 'lifts') {
    r.t++;
    if (r.throwAnim > 0) { r.throwAnim--; r.pose = 'throw'; }
    else r.pose = r.t > diff.springEvery - 30 ? 'holdNut' : 'idle';
    if (r.t >= diff.springEvery) {
      r.t = 0; r.throwAnim = 14;
      st.springs.push({ id: ++uid, type: 'spring', x: r.x + 18, y: st.T.y1, ph: 0, state: 'bounce', vy: 0 });
    }
  } else {
    r.x += r.dir * diff.robotSpeed;
    if (r.x < r.minX) { r.x = r.minX; r.dir = 1; }
    if (r.x > r.maxX) { r.x = r.maxX; r.dir = -1; }
    if (rnd() < 0.004) r.dir *= -1;
    r.pose = (st.frame >> 4) % 4 === 0 ? 'pound' : 'idle';
  }
}

function spawners() {
  if (st.type === 'belts') {
    for (const cs of st.crateSpawns) {
      if (--cs.t <= 0) {
        const near = Math.abs(pl.x - cs.x) < 16 && Math.abs(pl.y - cs.p.y1) < 4;
        if (!near) st.crates.push({ id: ++uid, type: 'crate', x: cs.x, y: cs.p.y1, ground: cs.p, state: 'ride', vy: 0, fx: 0 });
        cs.t = Math.round(diff.crateEvery * (0.6 + rnd() * 0.9));
      }
    }
  }
  if (st.sparkPts) {
    if (++st.sparkT >= st.sparkEvery && st.sparks.length < st.sparkMax) {
      st.sparkT = 0;
      const pts = st.sparkPts.filter(([x, y]) => Math.abs(y - pl.y) > 6 || Math.abs(x - pl.x) > 60);
      if (pts.length) { const [x, y] = pts[Math.floor(rnd() * pts.length)]; spawnSpark(x, y, 0); }
    }
  }
}

function smash(e) {
  st.fx.push({ type: 'smash', x: e.x, y: e.y - 5, t: 0 });
  addScore(e.type === 'spark' ? 500 : 300, e.x, e.y - 16); sfx.smash();
}

function checkHits() {
  const p = pl, body = { x1: p.x - 3, x2: p.x + 3, y1: p.y - 12, y2: p.y - 1 };
  let mb = null;
  if (p.mallet > 0 && p.state !== 'climb')
    mb = p.dir > 0 ? { x1: p.x - 6, x2: p.x + 20, y1: p.y - 30, y2: p.y } : { x1: p.x - 20, x2: p.x + 6, y1: p.y - 30, y2: p.y };
  for (const list of [st.drums, st.sparks, st.crates, st.springs]) {
    for (const e of list) {
      if (e.dead || (e.type === 'spark' && e.born < 24)) continue;
      const b = ebox(e);
      if (mb && hit(mb, b)) { e.dead = true; smash(e); continue; }
      if (hit(body, b)) { killPlayer(); return; }
    }
  }
  const r = st.robot;
  if (r && hit(body, { x1: r.x - 11, x2: r.x + 11, y1: r.y - 30, y2: r.y })) { killPlayer(); return; }
  if (p.state === 'air' && p.jumped) {
    for (const list of [st.drums, st.crates, st.springs]) for (const e of list) {
      if (e.dead || p.scored.has(e.id)) continue;
      if (Math.abs(e.x - p.x) < 7 && e.y > p.y && e.y - p.y < 22) { p.scored.add(e.id); addScore(100, p.x, p.y - 20); sfx.score(); }
    }
  }
}

function updateFx() {
  for (const f of st.fx) f.t++;
  st.fx = st.fx.filter(f => f.t < 24);
  for (const p of st.pops) { p.t++; p.y -= 0.3; }
  st.pops = st.pops.filter(p => p.t < 50);
}

function updatePlay() {
  st.frame++;
  if (st.fire > 0) st.fire--;
  if (st.type === 'lifts') for (const l of st.lifts) {
    l.y1 += l.v * diff.liftSpeed;
    if (l.v < 0 && l.y1 < 80) l.y1 += 192;
    if (l.v > 0 && l.y1 > 276) l.y1 -= 192;
    l.y2 = l.y1;
  }
  if (st.type === 'belts' && ++st.flipT >= 300) { st.flipT = 0; st.F1.belt *= -1; }

  updatePlayer(); if (game.state !== 'play') return;
  if (pl.state === 'walk' && pl.ground && pl.ground.shaft === 'A' && pl.y <= 84) { killPlayer(); return; }
  if (pl.y > H + 8) { killPlayer(); return; }

  updateRobot();
  spawners();
  st.drums.forEach(updateDrum); st.sparks.forEach(updateSpark); st.crates.forEach(updateCrate); st.springs.forEach(updateSpring);
  for (const k of ['drums', 'sparks', 'crates', 'springs']) st[k] = st[k].filter(e => !e.dead);

  for (const m of st.mallets) {
    if (m.taken || pl.state === 'climb') continue;
    if (Math.abs(pl.x - m.x) < 7 && pl.y - 13 < m.y && pl.y > m.y - 12) { m.taken = true; pl.mallet = 600; sfx.pickup(); }
  }

  if (st.bolts) {
    for (const b of st.bolts) {
      if (!b.alive) continue;
      const on = pl.state === 'walk' && Math.abs(pl.y - b.y1) < 2 && pl.x + FOOT > b.x1 + 1 && pl.x - FOOT < b.x2 - 1;
      if (on) b.touched = true;
      else if (b.touched) {
        b.alive = false; st.boltsLeft--;
        st.fx.push({ type: 'pop', x: (b.x1 + b.x2) / 2, y: b.y1 + 3, t: 0 });
        addScore(100, (b.x1 + b.x2) / 2, b.y1 - 12); sfx.bolt();
        if (st.boltsLeft <= 0) { stageClear(); return; }
      }
    }
  }

  checkHits(); if (game.state !== 'play') return;
  if (st.goal && pl.state === 'walk' && pl.ground === st.goal) { stageClear(); return; }

  if (st.frame % 120 === 0) {
    st.bonus = Math.max(0, st.bonus - 100);
    if (st.bonus === 0) { killPlayer(); return; }
    if (st.bonus <= 1000) sfx.warn();
  }
  musicTick();
  updateFx();
}

function step() {
  if (game.state !== 'paused') game.t++;
  switch (game.state) {
    case 'title':
      if (jumpBuf > 0 || startQueued) { jumpBuf = 0; startQueued = false; newGame(); }
      break;
    case 'intro':
      if (game.t >= 130 || (game.t > 40 && (jumpBuf > 0 || startQueued))) { jumpBuf = 0; startQueued = false; game.state = 'play'; game.t = 0; }
      break;
    case 'play': updatePlay(); break;
    case 'dying':
      pl.deadT++; st.frame++; updateFx();
      if (pl.deadT >= 140) {
        game.lives--;
        if (game.lives <= 0) { game.state = 'over'; game.t = 0; game.newHi = game.score > game.hiAtStart; saveHi(); sfx.over(); }
        else startIntro();
      }
      break;
    case 'clear': {
      st.frame++; updateFx();
      const r = st.robot;
      if (r.falling && !r.landed) {
        r.vy += 0.12; r.y += r.vy;
        if (r.y >= 248) { r.y = 248; r.landed = true; sfx.thud(); }
      }
      if (game.t >= 200) {
        game.stageIdx++;
        if (game.stageIdx >= stageList(game.level).length) { game.level++; game.stageIdx = 0; }
        startIntro();
      }
      break;
    }
    case 'over':
      if (game.t > 600 || (game.t > 60 && (jumpBuf > 0 || startQueued))) { jumpBuf = 0; startQueued = false; game.state = 'title'; game.t = 0; }
      break;
  }
  startQueued = false;
  if (jumpBuf > 0) jumpBuf--;
}

  const r = stageEl.getBoundingClientRect();
  let sc = Math.min((r.width - 16) / W, (r.height - 16) / H);
  if (sc >= 2) sc = Math.floor(sc * 2) / 2;
  sc = Math.max(sc, 0.5);
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
addEventListener('resize', fit); fit();

let last = performance.now(), acc = 0;
const DT = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= DT) { step(); acc -= DT; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// handy for debugging from the browser console
window.__boltz = {
  game, keys, get st() { return st; }, get pl() { return pl; },
  tick(n) { for (let i = 0; i < (n || 1); i++) step(); draw(); },
  press(k, on) { if (k === 'jump' && on && !keys.jump) jumpBuf = 8; keys[k] = on; },
  start() { startQueued = true; }
};
})();
</script>
