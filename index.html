<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>BOLTZ!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ---- the "pocket arcade": an orange handheld console around the game screen ---- */
  :root {
    color-scheme: dark;
    --shell-hi: #ffa64d; --shell: #ff801c; --shell-lo: #e46000;   /* orange plastic */
    --ink: #3a1500; --ink-soft: #6b2c00;                          /* printed labels */
    --bezel: #2a2420; --key: #2b2520; --key-hi: #3d352e;          /* dark screen surround + keys */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    touch-action: none; font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    background: radial-gradient(ellipse at 50% 25%, #3b2413, #120904 70%);
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    background: linear-gradient(165deg, var(--shell-hi) 0%, var(--shell) 40%, var(--shell-lo) 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.14);
  }
  #brand { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 0; }
  #brand .led { width: 8px; height: 8px; border-radius: 50%; background: #ff2d3d; box-shadow: 0 0 7px #ff2d3d, inset 0 -1px 1px rgba(0,0,0,.4); }
  #brand .logo { font-size: 15px; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.45); }
  #brand .sub { margin-left: auto; font-size: 7px; color: var(--ink-soft); letter-spacing: 1px; }
  #stage { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8px 12px; }
  #bezel {
    position: relative; padding: 12px; background: var(--bezel); border-radius: 12px 12px 34px 12px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.7), 0 2px 0 rgba(255,255,255,.35), 0 -1px 0 rgba(0,0,0,.2);
  }
  #bezel::after {   /* glass glare + faint scanlines over the screen */
    content: ''; position: absolute; inset: 12px; border-radius: 3px; pointer-events: none;
    background:
      linear-gradient(135deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 38%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
  }
  canvas {
    display: block; width: 224px; height: 256px; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #070b1e; border-radius: 3px;
  }
  #hint { flex: none; display: none; text-align: center; color: var(--ink-soft); font: 13px/1.4 system-ui, sans-serif; padding: 0 8px 14px; }
  #hint b { color: var(--ink); font-weight: 700; }

  #pad {
    --dp: min(150px, 39vw); --jb: min(100px, 26vw);
    flex: none; height: calc(var(--dp) + 44px); display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px max(12px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  /* Big invisible touch zones: the whole left side steers, the whole right side jumps.
     The drawn D-pad and JUMP button are only visuals, so near-misses still count. */
  .zone { flex: 1 0 auto; align-self: stretch; display: flex; align-items: center; touch-action: none; }
  #dzone { justify-content: flex-start; }
  #jzone { justify-content: flex-end; }
  #dpad, #jump { pointer-events: none; }
  /* cross-shaped D-pad in dark plastic, sitting in a shallow round well */
  #dpad {
    position: relative; width: var(--dp); height: var(--dp); flex: none; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,.16) 0 64%, transparent 65%);
  }
  #dpad::before, #dpad::after {
    content: ''; position: absolute; border-radius: 10px;
    background: linear-gradient(var(--key-hi), var(--key));
    box-shadow: 0 5px 0 #7a3200, inset 0 1px 0 rgba(255,255,255,.14);
  }
  #dpad::before { left: 8%; right: 8%; top: 34%; height: 32%; }
  #dpad::after  { top: 8%; bottom: 8%; left: 34%; width: 32%; }
  #dpad .knob {
    position: absolute; z-index: 2; left: 50%; top: 50%; width: 26%; height: 26%; margin: -13% 0 0 -13%; border-radius: 50%;
    background: rgba(255,214,160,.28); box-shadow: 0 0 0 2px rgba(255,214,160,.6); opacity: 0; transition: opacity .08s;
  }
  #dpad.on .knob { opacity: 1; }
  #dpad .a { position: absolute; z-index: 1; width: 0; height: 0; border-style: solid; }
  #dpad .up    { left: 50%; top: 15%;    transform: translateX(-50%); border-width: 0 10px 13px 10px; border-color: transparent transparent #85786c transparent; }
  #dpad .down  { left: 50%; bottom: 15%; transform: translateX(-50%); border-width: 13px 10px 0 10px; border-color: #85786c transparent transparent transparent; }
  #dpad .left  { top: 50%; left: 15%;    transform: translateY(-50%); border-width: 10px 13px 10px 0; border-color: transparent #85786c transparent transparent; }
  #dpad .right { top: 50%; right: 15%;   transform: translateY(-50%); border-width: 10px 0 10px 13px; border-color: transparent transparent transparent #85786c; }
  #dpad.u .up    { border-bottom-color: #ffd9a8; }
  #dpad.d .down  { border-top-color: #ffd9a8; }
  #dpad.l .left  { border-right-color: #ffd9a8; }
  #dpad.r .right { border-left-color: #ffd9a8; }
  #dpad .hub { position: absolute; z-index: 1; left: 50%; top: 50%; width: 18%; height: 18%; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(#1c1814, #2e2721); }

  /* big round red action button */
  #jump {
    width: var(--jb); height: var(--jb); border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 32%, #ff6b7d, #d81f3a 55%, #9c1029);
    color: #ffe3e7; font-size: 11px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 7px 0 #7a0c1f, 0 10px 12px rgba(80,20,0,.35), inset 0 2px 0 rgba(255,255,255,.35);
  }
  #jump.on { transform: translateY(5px); box-shadow: 0 2px 0 #7a0c1f, 0 4px 6px rgba(80,20,0,.3), inset 0 2px 0 rgba(255,255,255,.35); filter: brightness(1.1); }
  #mid { display: flex; flex-direction: column; gap: 14px; align-items: center; position: relative; z-index: 2; }
  #mid button {
    font: inherit; font-size: 8px; color: #ffd9b0; white-space: nowrap; border: none; border-radius: 999px;
    background: linear-gradient(var(--key-hi), var(--key)); box-shadow: 0 3px 0 #7a3200, inset 0 1px 0 rgba(255,255,255,.14);
    padding: 10px 8px; min-width: 80px; touch-action: manipulation; cursor: pointer;
  }
  #mid button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a3200; }

  @media (hover: hover) and (pointer: fine) {
    /* on a computer: a centred handheld with rounded corners, played with the keyboard */
    #app { inset: 16px auto 16px 50%; transform: translateX(-50%); width: min(600px, calc(100vw - 32px)); border-radius: 30px;
           box-shadow: 0 40px 90px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.14); }
    #pad { display: none; }
    #hint { display: block; }
  }
  @media (orientation: landscape) and (pointer: coarse) {
    #brand { display: none; }
    #pad { position: absolute; inset: 0; height: auto; padding: 0; pointer-events: none; }
    #dzone { position: absolute; left: 0; bottom: 0; width: min(42vw, 300px); height: 85%; align-items: flex-end; pointer-events: auto;
             padding: 0 0 calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
    #jzone { position: absolute; right: 0; bottom: 0; width: min(36vw, 260px); height: 72%; align-items: flex-end; pointer-events: auto;
             padding: 0 calc(24px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) 0; }
    #mid  { position: absolute; right: calc(16px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); pointer-events: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><span class="led"></span><span class="logo">BOLTZ!</span><span class="sub">POCKET ARCADE</span></div>
  <div id="stage"><div id="bezel"><canvas id="c" aria-label="BOLTZ! game screen"></canvas></div></div>
  <div id="hint"><b>← →</b> move &nbsp;·&nbsp; <b>↑ ↓</b> climb &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Enter</b> start &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> sound</div>
  <div id="pad">
    <div id="dzone" class="zone" aria-label="Direction pad"><div id="dpad"><span class="a up"></span><span class="a down"></span><span class="a left"></span><span class="a right"></span><span class="hub"></span><span class="knob"></span></div></div>
    <div id="mid"><button id="bStart" type="button">START</button><button id="bMute" type="button">SOUND ON</button></div>
    <div id="jzone" class="zone" aria-label="Jump"><div id="jump">JUMP</div></div>
  </div>
</div>
<script>
(function () {
'use strict';

/* ================================================================
   BOLTZ! — an original arcade climber.
   Boltz the robot has nabbed Sparky the dog. Climb the shipyard
   gantry, dodge oil drums, crates, sparks and bouncing nuts.
   ================================================================ */

const W = 224, H = 256, S = 4;           // logical screen, internal render scale
// JUMP_G is a touch lighter than normal gravity: a committed, slightly floaty arcade hop (~half a second).
const FOOT = 2, GRAV = 0.16, JUMP_V = -2.0, JUMP_G = 0.12, MAXFALL = 3.2, FALL_DEATH = 22, WALK = 1.0, CLIMB = 0.8;
const FONT = '"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
const C = {
  bg: '#070b1e', girder: '#ffb000', girderHi: '#ffd36b', ladder: '#b8c7dd', white: '#ffffff',
  cyan: '#58e1ff', red: '#ff3b6b', dim: '#5d6688', yellow: '#ffe066', soft: '#9aa4c7'
};

const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.random;
const pad6 = n => String(Math.floor(n)).padStart(6, '0');
const isTouch = matchMedia('(pointer: coarse)').matches;
let uid = 0;

function txt(s, x, y, col, align, size) {
  ctx.font = (size || 8) + 'px ' + FONT;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function txtS(s, x, y, col, align, size, sh) {
  const o = (size || 8) >= 16 ? 2 : 1;
  txt(s, x + o, y + o, sh || '#000', align, size); txt(s, x, y, col, align, size);
}

/* ---------------- pixel sprites ---------------- */
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const mk = flip => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x]; if (ch === '.' || !pal[ch]) continue;
        g.fillStyle = pal[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
      }
    });
    return c;
  };
  return { r: mk(false), l: mk(true), w, h };
}
function spr(s, x, y, flip) { ctx.drawImage(flip ? s.l : s.r, Math.round(x), Math.round(y)); }

const HP = { H: '#ff7a1a', h: '#b84a00', V: '#58e1ff', S: '#f2b880', O: '#18b38a', o: '#0b6b55', B: '#6b3b16', W: '#eef2f7', Y: '#ffd23f' };
const TOP = [
  '....HHHH....',
  '...HHHHHHH..',
  '..HHHHHYYH..',
  '..hhhhhhhhhh',
  '...SSSVVVV..',
  '...SSSVVVV..',
  '....SSSSS...',
  '...OOYYOO...',
  '..OOOOOOOO..',
  '.WOOOOOOOOW.',
  '.WWOoOOoOWW.'
];
const HERO = {
  stand: sprite(TOP.concat(['...OOOOOO...', '...OOO.OOO..', '...OO...OO..', '..BBB..BBB..', '..BBB..BBBB.']), HP),
  w1:    sprite(TOP.concat(['...OOOOOO...', '..OOO..OOO..', '.OO......OO.', 'BBB......BBB', 'BB........BB']), HP),
  w2:    sprite(TOP.concat(['...OOOOOO...', '....OOOO....', '....OOO.....', '....BBBB....', '....BBBBB...']), HP),
  jump:  sprite(TOP.concat(['..OOOOOOO...', '.OOO...OOO..', 'BBB.....BBB.', 'BB.......BB.', '............']), HP),
  climb: sprite([
    '....HHHH....',
    '...HHHHHH...',
    '..HHHHHHHH..',
    '..hhhhhhhh..',
    'W..SSSSSS..W',
    'WO..SSSS..OW',
    '.OO.OOOO.OO.',
    '..OOOOOOOO..',
    '...OOOOOO...',
    '...OYOOYO...',
    '...oOOOOo...',
    '...OOOOOO...',
    '...OO..OO...',
    '...OO..OO...',
    '..BBB...OO..',
    '..BB....BBB.'
  ], HP)
};
const DP = { w: '#f5f5f5', b: '#a0662f', k: '#111111', R: '#ff3b6b' };
const DOG1 = sprite([
  '..b...........',
  '.bwb..........',
  'kwwwb.........',
  '.wwwwRwwwwwwb.',
  '..wwwRwbbwwwwb',
  '...wwwwbbwww..',
  '...wwwwwwwww..',
  '...w.w...w.w..',
  '...w.w...w.w..'
], DP);
const DOG2 = sprite([
  '..b...........',
  '.bwb..........',
  'kwwwb.........',
  '.wwwwRwwwwww..',
  '..wwwRwbbwwwww',
  '...wwwwbbwwwb.',
  '...wwwwwwwww..',
  '...w.w...w.w..',
  '....w.w...w.w.'
], DP);
const HEART = sprite(['.RR.RR.', 'RRRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'], { R: '#ff3b6b' });

const STARS = Array.from({ length: 46 }, () => [Math.floor(rnd() * W), Math.floor(30 + rnd() * (H - 40)), rnd() < 0.3]);

/* ---------------- audio (all synthesized) ---------------- */
let actx = null, master = null, noiseBuf = null, muted = false, iosKeepAlive = null;
try { muted = localStorage.getItem('gp_muted') === '1'; } catch (e) {}
// A silent looping <audio> element switches iPhones to "media playback" mode, so the game's
// sound is heard even when the ring/silent switch is set to silent.
function silentWavURL() {
  const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlockAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      actx = new AC();
      const comp = actx.createDynamicsCompressor();          // keeps it loud and punchy without clipping
      comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
      master = actx.createGain(); master.gain.value = 1.0;
      master.connect(comp); comp.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.5), actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    } catch (e) { actx = null; return; }
  }
  if (actx.state === 'suspended') actx.resume();
  if (!iosKeepAlive) {
    try { iosKeepAlive = new Audio(silentWavURL()); iosKeepAlive.loop = true; iosKeepAlive.setAttribute('playsinline', ''); iosKeepAlive.play().catch(() => {}); } catch (e) {}
  }
}
function tone(f, d, type, v, to, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v || 0.08, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, v, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = noiseBuf;
  g.gain.setValueAtTime(v || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d);
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
// Play a little melody: notes = MIDI numbers (0 = rest), each lasting `len` seconds.
function jingle(notes, len, type, v, delay) {
  notes.forEach((n, i) => { if (n) tone(midi(n), len * 0.92, type || 'square', v || 0.09, null, (delay || 0) + i * len); });
}
let lastThud = 0;
const sfx = {
  // footsteps: a bright two-tone "tick, tock" you can hear on a phone speaker
  step(alt) { tone(alt ? 520 : 390, 0.035, 'square', 0.06, alt ? 300 : 230); },
  climb(alt) { tone(alt ? 660 : 560, 0.03, 'square', 0.05); },
  jump()   { tone(280, 0.16, 'square', 0.1, 950); },
  land()   { tone(220, 0.05, 'square', 0.06, 110); noise(0.03, 0.05); },
  score()  { tone(1319, 0.05, 'square', 0.07); tone(1760, 0.09, 'square', 0.07, null, 0.05); },
  smash()  { noise(0.18, 0.22); tone(330, 0.16, 'sawtooth', 0.1, 70); },
  hit()    { noise(0.12, 0.2); tone(180, 0.18, 'square', 0.12, 60); },
  pickup() { jingle([72, 76, 79, 84, 88], 0.06, 'square', 0.08); },
  bolt()   { tone(1175, 0.05, 'square', 0.09); tone(1568, 0.1, 'square', 0.09, null, 0.05); },
  die()    { jingle([79, 78, 77, 76, 74, 72, 69, 65, 0, 57], 0.11, 'square', 0.1); noise(0.25, 0.12, 1.05); },
  clear()  { jingle([72, 76, 79, 76, 79, 84, 0, 84], 0.1, 'square', 0.09); jingle([48, 0, 55, 0, 60, 0, 0, 60], 0.1, 'square', 0.07); },
  levelClear() { jingle([72, 72, 76, 79, 84, 79, 84, 88, 0, 91], 0.11, 'square', 0.09); jingle([48, 0, 55, 0, 60, 0, 64, 0, 0, 60], 0.11, 'square', 0.07); },
  throw()  { noise(0.08, 0.1); tone(160, 0.12, 'square', 0.1, 80); },
  thud()   { if (performance.now() - lastThud < 70) return; lastThud = performance.now(); tone(150, 0.06, 'square', 0.07, 70); },
  stomp()  { noise(0.15, 0.2); tone(110, 0.2, 'square', 0.14, 45); },
  jet()    { noise(0.5, 0.12); tone(200, 0.5, 'sawtooth', 0.05, 900); },
  boing()  { tone(330, 0.09, 'square', 0.05, 760); },
  drop()   { tone(800, 0.25, 'square', 0.05, 200); },
  fire()   { noise(0.25, 0.1); tone(240, 0.2, 'sawtooth', 0.04, 480); },
  start()  { jingle([67, 72, 76, 79, 0, 76, 79, 84], 0.09, 'square', 0.09); jingle([43, 0, 48, 0, 0, 52, 0, 48], 0.09, 'square', 0.07); },
  ready()  { jingle([72, 0, 72, 0, 79], 0.1, 'square', 0.08); },
  over()   { jingle([72, 67, 64, 60, 0, 59, 60], 0.18, 'square', 0.09); },
  life()   { jingle([84, 88, 91, 96], 0.07, 'square', 0.08); },
  warn()   { tone(1400, 0.05, 'square', 0.05); }
};
// Original looping tunes: [melody, bass] per step. Pitched high enough for phone speakers.
const TUNES = {
  ramps: { f: 9,
    lead: [69, 0, 72, 0, 76, 0, 74, 72, 69, 0, 0, 0, 65, 0, 69, 0, 67, 0, 71, 0, 74, 0, 72, 71, 68, 0, 71, 0, 76, 0, 0, 0],
    bass: [57, 0, 64, 0, 57, 0, 64, 0, 53, 0, 60, 0, 53, 0, 60, 0, 55, 0, 62, 0, 55, 0, 62, 0, 52, 0, 59, 0, 52, 0, 56, 0] },
  belts: { f: 9,
    lead: [72, 74, 76, 0, 79, 0, 76, 0, 77, 0, 76, 74, 72, 0, 0, 0, 74, 76, 77, 0, 79, 0, 77, 0, 76, 0, 74, 0, 72, 0, 0, 0],
    bass: [48, 0, 55, 0, 48, 0, 55, 0, 53, 0, 60, 0, 53, 0, 60, 0, 55, 0, 62, 0, 55, 0, 62, 0, 48, 0, 55, 0, 52, 0, 55, 0] },

/* ---------------- geometry ---------------- */
function P(x1, y1, x2, y2, o) {

}
function surf(p, x) {
  if (p.x2 === p.x1 || p.y1 === p.y2) return p.y1;
  const t = clamp((x - p.x1) / (p.x2 - p.x1), 0, 1);
  return p.y1 + (p.y2 - p.y1) * t;
}
function L(x, lo, up) { return { x, top: surf(up, x), bottom: surf(lo, x) }; }
function support(x, y, tol, enemy) {
  let best = null, bd = 1e9;
  for (const p of st.plats) {
    if (!p.alive || (enemy && p.kind === 'lift')) continue;
    if (x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const d = Math.abs(surf(p, x) - y);
    if (d <= tol && d < bd) { bd = d; best = p; }
  }

}

function stepSupport(x, y) {
  let best = null, bd = 1e9;
  for (const p of st.plats) {
    if (!p.alive || x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const s = surf(p, x), d = s - y;
    if (d >= -8 && d <= 3.5 && Math.abs(d) < bd) { bd = Math.abs(d); best = p; }
  }

}

  let best = null, bs = 1e9;
  for (const p of st.plats) {
    if (!p.alive || (enemy && p.kind === 'lift')) continue;
    if (x + FOOT < p.x1 || x - FOOT > p.x2) continue;
    const s = surf(p, x);
    if (s >= y0 - 1.5 && s <= y1 + 0.5 && s < bs) { bs = s; best = p; }
  }

}

/* ---- opening cutscene: Boltz climbs the gantry with Sparky, tosses him to the top, and stomps ---- */
const OP = { climbStart: 30, climbEnd: 0, walkEnd: 0, tossEnd: 0, stompEnd: 0, end: 0 };
function startOpening() {
  buildStage('ramps');
  game.state = 'opening'; game.t = 0;
  const r = st.robot, G0 = st.plats[0], G5 = st.plats[5];
  st.op = { x0: 200, yBottom: surf(G0, 200), yTop: surf(G5, 200), homeX: r.x };
  r.x = 200; r.y = st.op.yBottom; r.pose = 'holdDog';
  st.dogHeld = true;
  OP.climbEnd = OP.climbStart + Math.ceil((st.op.yBottom - st.op.yTop) / 1.15);
  OP.walkEnd = OP.climbEnd + Math.ceil((200 - st.op.homeX) / 1.6);
  OP.tossEnd = OP.walkEnd + 40;
  OP.stompEnd = OP.tossEnd + 66;
  OP.end = OP.stompEnd + 50;
}
function updateOpening() {
  st.frame++;
  const t = game.t, r = st.robot, o = st.op, G5 = st.plats[5];
  if (t < OP.climbStart) { r.pose = 'holdDog'; }
  else if (t < OP.climbEnd) {
    r.y = Math.max(o.yTop, o.yBottom - (t - OP.climbStart) * 1.15); r.pose = 'holdDog'; r.climbing = true;
    if (t % 10 === 0) sfx.climb((t / 10) & 1);
  } else if (t < OP.walkEnd) {
    r.climbing = false; r.x = Math.max(o.homeX, 200 - (t - OP.climbEnd) * 1.6); r.y = surf(G5, r.x); r.pose = 'holdDog';
    if (t % 8 === 0) sfx.thud();
  } else if (t < OP.tossEnd) {
    if (t === OP.walkEnd) { st.dogHeld = false; st.dogFly = 0; sfx.boing(); }
    st.dogFly = (t - OP.walkEnd) / 40; r.pose = 'throw';
  } else if (t < OP.stompEnd) {
    st.dogFly = null; r.pose = 'pound';
    if ((t - OP.tossEnd) % 22 === 0) { sfx.stomp(); st.shake = 10; }
  } else r.pose = 'idle';
  if (t >= OP.end) startIntro();
}

/* ---- stage-end cutscene: Boltz jets over, snatches Sparky and blasts off to the next stage ---- */
function updateEscape() {
  const t = game.t, r = st.robot, d = st.dog;
  if (t < 70) { r.pose = 'pound'; return; }
  if (t === 70) { r.jet = true; r.sx = r.x; r.sy = r.y; sfx.jet(); }
  if (t <= 115) {
    const k = (t - 70) / 45, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    r.x = r.sx + (d.x - r.sx) * e; r.y = r.sy + (d.y - 12 - r.sy) * e - Math.sin(k * Math.PI) * 8; r.pose = 'fall';
  } else {
    if (!st.dogCarried) { st.dogCarried = true; sfx.boing(); }
    r.vy = (r.vy || 0) + 0.12; r.y -= 0.8 + r.vy; r.pose = 'fall';
    if (t % 12 === 0 && r.y > -40) sfx.thud();
  }
}

/* ---- touch: D-pad zone (left) ----
   - the whole left zone listens, direction is measured from the drawn pad's centre
   - analog-style sectors: horizontal stays on until the thumb is 70° off the axis (smooth walking),
     vertical needs the thumb within 50° of up/down (so walking past a ladder doesn't grab it)
   - a newly pressed direction is held for at least LATCH frames, so a quick tap is never lost */
const dzone = document.getElementById('dzone'), dpad = document.getElementById('dpad'), knob = dpad.querySelector('.knob');
let dpadId = null;
function dpadSet(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const dead = Math.max(7, r.width * 0.07), mag = Math.hypot(dx, dy);
  let L = false, Rt = false, U = false, D = false;
  if (mag > dead) {
    const a = Math.atan2(dy, dx) * 180 / Math.PI;     // 0 = right, 90 = down, -90 = up
    Rt = Math.abs(a) < 70; L = Math.abs(a) > 110;
    D = a > 40 && a < 140; U = a < -40 && a > -140;
  }
  setDir('left', L); setDir('right', Rt); setDir('up', U); setDir('down', D);
  const k = Math.min(1, mag / (r.width * 0.36)), kx = mag ? dx / mag * k * r.width * 0.3 : 0, ky = mag ? dy / mag * k * r.width * 0.3 : 0;
  knob.style.transform = 'translate(' + kx.toFixed(1) + 'px,' + ky.toFixed(1) + 'px)';
  dpadVis();
}
function setDir(k, on) { if (on && !keys[k]) latch[k] = LATCH; keys[k] = on; }
function dpadVis() {
  dpad.classList.toggle('u', K('up')); dpad.classList.toggle('d', K('down'));
  dpad.classList.toggle('l', K('left')); dpad.classList.toggle('r', K('right'));
  dpad.classList.toggle('on', dpadId !== null);
}
function dpadRelease() {
  dpadId = null; keys.left = keys.right = keys.up = keys.down = false;
  knob.style.transform = ''; dpadVis();
}

dzone.addEventListener('pointermove', e => { if (e.pointerId === dpadId) dpadSet(e); });

function updatePlayer() {
  const p = pl;
  if (p.mallet > 0) p.mallet--;
  const h = (K('right') ? 1 : 0) - (K('left') ? 1 : 0);

  if (p.state === 'climb') {
    const l = p.ladder; let moved = false;
    if (K('up')) { p.y -= CLIMB; moved = true; if (p.y <= l.top) { p.y = l.top; p.state = 'walk'; p.ground = support(p.x, p.y, 3); } }
    else if (K('down')) { p.y += CLIMB; moved = true; if (p.y >= l.bottom) { p.y = l.bottom; p.state = 'walk'; p.ground = support(p.x, p.y, 3); } }
    if (moved) { p.anim++; if (p.anim % 8 === 0) sfx.climb((p.anim >> 3) & 1); }
    if (p.state === 'walk') p.anim = 0;
    return;
  }

  if (p.state === 'walk') {
    if (!p.mallet) {
      // generous ladder grab: within 6px, pick the nearest ladder and snap onto it
      const near = (yKey) => {
        let best = null, bd = 7;
        for (const l of st.ladders) {
          const d = Math.abs(p.x - l.x);
          if (d < bd && Math.abs(p.y - l[yKey]) <= 3) { bd = d; best = l; }
        }
        return best;
      };
      if (K('up')) { const l = near('bottom'); if (l) { p.state = 'climb'; p.ladder = l; p.x = l.x; p.anim = 0; return; } }
      if (K('down')) { const l = near('top'); if (l) { p.state = 'climb'; p.ladder = l; p.x = l.x; p.y += 1; p.anim = 0; return; } }
    }
    if (h) p.dir = h;
    const g = p.ground, belt = g && g.kind === 'belt' ? g.belt : 0;
    if (jumpBuf > 0 && !p.mallet) {
      jumpBuf = 0; p.state = 'air'; p.vy = JUMP_V; p.jvx = h * WALK + belt * 0.5;
      p.peak = p.y; p.jumped = true; p.scored = new Set(); sfx.jump(); return;
    }
    const nx = clamp(p.x + h * WALK + belt, 4, W - 4);
    const s = stepSupport(nx, p.y);
    p.x = nx;
    if (s) { p.ground = s; p.y = surf(s, p.x); }
    else { p.state = 'air'; p.vy = 0; p.jvx = 0; p.peak = p.y; p.jumped = false; p.ground = null; p.airT = 0; p.offDir = h; }
    if (h) { p.anim++; if (p.anim % 8 === 1) sfx.step((p.anim >> 3) & 1); } else p.anim = 0;
    return;
  }

  if (p.state === 'air') {
    p.airT = (p.airT || 0) + 1;
    // "coyote time": a jump pressed just after walking off an edge still counts
    if (jumpBuf > 0 && !p.jumped && !p.mallet && p.airT <= COYOTE) {
      jumpBuf = 0; p.vy = JUMP_V; p.jvx = (h || p.offDir || 0) * WALK;
      p.peak = p.y; p.jumped = true; p.scored = new Set(); sfx.jump(); return;
    }
    p.vy = Math.min(p.vy + (p.jumped ? JUMP_G : GRAV), MAXFALL);
    p.x = clamp(p.x + p.jvx, 4, W - 4);
    const ny = p.y + p.vy;
    if (p.vy > 0) {
      const s = landing(p.x, p.y, ny);
      if (s) {
        p.y = surf(s, p.x); p.state = 'walk'; p.ground = s; p.anim = 0;
        if (p.y - p.peak > FALL_DEATH) killPlayer(); else sfx.land();
        return;
      }
    }
    p.y = ny; if (p.y < p.peak) p.peak = p.y;
  }
}

function furnaceHit() {
  st.furnaceLit = true; st.fire = 30; sfx.fire();
  if (st.sparks.length < diff.sparkMax) spawnSpark(24, surf(st.plats[0], 24), 0);
}

function updateDrum(d) {
  if (d.state === 'wild') {
    d.vy = Math.min(d.vy + GRAV * 0.8, 2.6);
    d.x += d.vx; d.rot += d.vx;
    if (d.x < 6 || d.x > W - 6) { d.vx = -d.vx; d.x = clamp(d.x, 6, W - 6); }
    const ny = d.y + d.vy, G0 = st.plats[0];
    if (d.vy > 0) {
      let hp = null, hs = 1e9;
      for (const p of st.plats) {
        if (!p.alive || d.x + FOOT < p.x1 || d.x - FOOT > p.x2) continue;
        if (d.straight && p !== G0) continue;           // first drum drops straight through
        const s = surf(p, d.x);
        if (s > d.bounceY + 2 && s >= d.y - 0.5 && s <= ny + 0.5 && s < hs) { hs = s; hp = p; }
      }
      if (hp === G0) { d.y = hs; d.state = 'roll'; d.ground = G0; d.dir = -1; d.lastL = null; sfx.thud(); return; }
      if (hp) {
        d.y = hs; d.bounceY = hs; d.vy = -1.1; sfx.thud();
        d.vx = Math.abs(d.vx) * (pl.x >= d.x ? 1 : -1);  // steer toward the player
        return;
      }
    }
    d.y = ny; if (d.y > H + 12) d.dead = true;
    return;
  }
  if (d.state === 'ladder') {
    d.y += 1.2;
    if (d.y >= d.ladder.bottom) {
      d.y = d.ladder.bottom; const g = support(d.x, d.y, 3, true);
      d.ground = g; d.state = 'roll'; d.dir = (g && g.down) || -d.dir; d.lastL = d.ladder;
    }
    return;
  }
  if (d.state === 'fall') {
    d.vy = Math.min(d.vy + GRAV, MAXFALL); d.x += d.dir * 0.5;
    const ny = d.y + d.vy, g = d.vy > 0 ? landing(d.x, d.y, ny, true) : null;
    if (g && !d.hopped && d.vy > 1) {
      // drums bounce once when they hit the girder below, then roll on
      d.y = surf(g, d.x); d.vy = -1.0; d.hopped = true; d.dir = g.down || -d.dir; sfx.thud();
    } else if (g) { d.y = surf(g, d.x); d.ground = g; d.state = 'roll'; d.dir = g.down || -d.dir; d.lastL = null; }
    else d.y = ny;
    if (d.y > H + 12) d.dead = true;
    return;
  }
  const px = d.x;
  d.x += d.dir * diff.drumSpeed; d.rot += d.dir * diff.drumSpeed;
  const g = support(d.x, d.y, 3, true);
  if (!g) { d.state = 'fall'; d.vy = 0; d.hopped = false; return; }
  d.ground = g; d.y = surf(g, d.x);
  if (st.type === 'ramps' && g === st.plats[0] && d.x <= 22) { d.dead = true; furnaceHit(); return; }
  if (d.lastL && Math.abs(d.x - d.lastL.x) > 8) d.lastL = null;
  for (const l of st.ladders) {
    if (l === d.lastL || (px - l.x) * (d.x - l.x) > 0) continue;
    if (Math.abs(l.top - d.y) < 3) {
      d.lastL = l;
      let pr = diff.ladderP; if (pl.y > d.y + 8 && Math.abs(pl.x - l.x) < 48) pr += 0.25;
      if (rnd() < pr) { d.state = 'ladder'; d.ladder = l; d.x = l.x; }
      break;
    }
  }
}

function updateSpark(s) {
  s.born++;
  if (s.state === 'fall') {
    s.vy = Math.min(s.vy + GRAV, MAXFALL);
    const ny = s.y + s.vy, g = landing(s.x, s.y, ny, true);
    if (g) { s.y = surf(g, s.x); s.state = 'walk'; s.ground = g; } else s.y = ny;
    if (s.y > H + 10) s.dead = true;
    return;
  }
  if (s.state === 'climb') {
    const l = s.ladder; s.y += s.cdir * diff.sparkSpeed * 0.8;
    if (s.cdir < 0 && s.y <= l.top) { s.y = l.top; s.state = 'walk'; s.lastL = l; s.dir = rnd() < 0.5 ? 1 : -1; }
    else if (s.cdir > 0 && s.y >= l.bottom) { s.y = l.bottom; s.state = 'walk'; s.lastL = l; s.dir = rnd() < 0.5 ? 1 : -1; }
    return;
  }
  if (!support(s.x, s.y, 3, true)) { s.state = 'fall'; s.vy = 0; return; }
  if (rnd() < 0.004) s.dir *= -1;
  if (rnd() < 0.02 && Math.abs(pl.y - s.y) < 6) s.dir = pl.x > s.x ? 1 : -1;
  const px = s.x, nx = s.x + s.dir * diff.sparkSpeed, g = support(nx, s.y, 3, true);
  if (!g || nx < 4 || nx > W - 4) { s.dir *= -1; return; }
  s.x = nx; s.y = surf(g, nx); s.ground = g;
  if (s.lastL && Math.abs(s.x - s.lastL.x) > 6) s.lastL = null;
  for (const l of st.ladders) {
    if (l === s.lastL || (px - l.x) * (s.x - l.x) > 0) continue;
    if (Math.abs(l.bottom - s.y) < 3) {
      s.lastL = l;
      if (rnd() < (pl.y < s.y - 6 ? 0.55 : 0.18)) { s.state = 'climb'; s.cdir = -1; s.ladder = l; s.x = l.x; }
      break;
    }
    if (Math.abs(l.top - s.y) < 3) {
      s.lastL = l;
      if (rnd() < (pl.y > s.y + 6 ? 0.55 : 0.18)) { s.state = 'climb'; s.cdir = 1; s.ladder = l; s.x = l.x; }
      break;
    }
  }
}

function updateCrate(c) {
  if (c.state === 'ride') {
    c.x += c.ground.belt;
    if (c.x < c.ground.x1 - 3 || c.x > c.ground.x2 + 3) { c.state = 'fall'; c.vy = 0; c.fx = Math.sign(c.ground.belt) * 0.4; }
    else c.y = c.ground.y1;
  } else {
    c.vy = Math.min(c.vy + GRAV, MAXFALL); c.y += c.vy; c.x += c.fx;
    if (c.y > c.ground.y1 + 34) c.dead = true;
  }
}

function updateSpring(s) {
  if (s.state === 'bounce') {
    s.x += diff.springSpeed; s.ph += 0.13;
    const k = Math.abs(Math.sin(s.ph)); s.y = st.T.y1 - k * 15;
    if (k < 0.13 && !s.tick) { s.tick = true; sfx.boing(); }
    if (k > 0.5) s.tick = false;
    if (s.x >= 214) { s.state = 'drop'; s.x = 216; s.vy = 0.6; sfx.drop(); }
  } else {
    s.vy = Math.min(s.vy + 0.08, 2.4); s.y += s.vy;
    if (s.y > H + 12) s.dead = true;
  }
}

function updateRobot() {
  const r = st.robot; r.f = (r.f || 0) + 1;
  if (st.type === 'ramps') {
    r.t++;
    if (r.throwAnim > 0) { r.throwAnim--; r.pose = 'throw'; }
    else if (r.t >= diff.throwEvery - 28) r.pose = 'hold';
    else r.pose = (Math.floor(st.frame / 20) % 6 === 0) ? 'pound' : 'idle';
    if (r.t >= diff.throwEvery) {
      r.t = 0; r.throwAnim = 16; sfx.throw();
      const g = st.plats[5];
      if (!st.firstDrum) {
        // the stage's first drum is a blue one dropped straight down to light the furnace
        st.firstDrum = true;
        const x = 18;
        st.drums.push({ id: ++uid, type: 'drum', blue: true, straight: true, x, y: surf(g, x), dir: -1, state: 'wild', vx: 0, vy: 0, bounceY: surf(g, x), rot: 0, lastL: null });
      } else if (rnd() < diff.wildP) {
        // a "wild" blue drum: bounces diagonally down through the girders, steering toward you
        const x = r.x + 20;
        st.drums.push({ id: ++uid, type: 'drum', blue: true, x, y: surf(g, x), dir: 1, state: 'wild', vx: 0.6 + rnd() * 0.5, vy: -0.8, bounceY: surf(g, x), rot: 0, lastL: null });
      } else {
        const x = r.x + 20;
        st.drums.push({ id: ++uid, type: 'drum', x, y: surf(g, x), dir: 1, state: 'roll', ground: g, rot: 0, vy: 0, lastL: null });
      }
    }
  } else if (st.type === 'lifts') {
    r.t++;
    if (r.throwAnim > 0) { r.throwAnim--; r.pose = 'throw'; }
    else r.pose = r.t > diff.springEvery - 30 ? 'holdNut' : 'idle';
    if (r.t >= diff.springEvery) {
      r.t = 0; r.throwAnim = 14;
      st.springs.push({ id: ++uid, type: 'spring', x: r.x + 18, y: st.T.y1, ph: 0, state: 'bounce', vy: 0 });
    }
  } else {
    r.x += r.dir * diff.robotSpeed;
    if (r.x < r.minX) { r.x = r.minX; r.dir = 1; }
    if (r.x > r.maxX) { r.x = r.maxX; r.dir = -1; }
    if (rnd() < 0.004) r.dir *= -1;
    r.pose = (st.frame >> 4) % 4 === 0 ? 'pound' : 'idle';
  }
}

function spawners() {
  if (st.type === 'belts') {
    for (const cs of st.crateSpawns) {
      if (--cs.t <= 0) {
        const near = Math.abs(pl.x - cs.x) < 16 && Math.abs(pl.y - cs.p.y1) < 4;
        if (!near) st.crates.push({ id: ++uid, type: 'crate', x: cs.x, y: cs.p.y1, ground: cs.p, state: 'ride', vy: 0, fx: 0 });
        cs.t = Math.round(diff.crateEvery * (0.6 + rnd() * 0.9));
      }
    }
  }
  if (st.sparkPts) {
    if (++st.sparkT >= st.sparkEvery && st.sparks.length < st.sparkMax) {
      st.sparkT = 0;
      const pts = st.sparkPts.filter(([x, y]) => Math.abs(y - pl.y) > 6 || Math.abs(x - pl.x) > 60);
      if (pts.length) { const [x, y] = pts[Math.floor(rnd() * pts.length)]; spawnSpark(x, y, 0); }
    }
  }
}

function smash(e) {
  st.fx.push({ type: 'smash', x: e.x, y: e.y - 5, t: 0 });
  st.freeze = 6; st.shake = 4;
  addScore(e.type === 'spark' ? 500 : 300, e.x, e.y - 16); sfx.smash();
}

function checkHits() {
  const p = pl, body = { x1: p.x - 2, x2: p.x + 2, y1: p.y - 11, y2: p.y - 1 };
  let mb = null;
  if (p.mallet > 0 && p.state !== 'climb')
    mb = p.dir > 0 ? { x1: p.x - 6, x2: p.x + 20, y1: p.y - 30, y2: p.y } : { x1: p.x - 20, x2: p.x + 6, y1: p.y - 30, y2: p.y };
  for (const list of [st.drums, st.sparks, st.crates, st.springs]) {
    for (const e of list) {
      if (e.dead || (e.type === 'spark' && e.born < 24)) continue;
      const b = ebox(e);
      if (mb && hit(mb, b)) { e.dead = true; smash(e); continue; }
      if (hit(body, b)) { killPlayer(); return; }
    }
  }
  const r = st.robot;
  if (r && hit(body, { x1: r.x - 11, x2: r.x + 11, y1: r.y - 30, y2: r.y })) { killPlayer(); return; }
  if (p.state === 'air' && p.jumped) {
    for (const list of [st.drums, st.crates, st.springs]) for (const e of list) {
      if (e.dead || p.scored.has(e.id)) continue;
      if (Math.abs(e.x - p.x) < 7 && e.y > p.y && e.y - p.y < 22) { p.scored.add(e.id); addScore(100, p.x, p.y - 20); sfx.score(); }
    }
  }
}

function updateFx() {
  for (const f of st.fx) f.t++;
  st.fx = st.fx.filter(f => f.t < 24);
  for (const p of st.pops) { p.t++; p.y -= 0.3; }
  st.pops = st.pops.filter(p => p.t < 50);
}

function updatePlay() {
  st.frame++;
  if (st.fire > 0) st.fire--;
  if (st.type === 'lifts') for (const l of st.lifts) {
    l.y1 += l.v * diff.liftSpeed;
    if (l.v < 0 && l.y1 < 80) l.y1 += 192;
    if (l.v > 0 && l.y1 > 276) l.y1 -= 192;
    l.y2 = l.y1;
  }
  if (st.type === 'belts' && ++st.flipT >= 300) { st.flipT = 0; st.F1.belt *= -1; }

  updatePlayer(); if (game.state !== 'play') return;
  if (pl.state === 'walk' && pl.ground && pl.ground.shaft === 'A' && pl.y <= 84) { killPlayer(); return; }
  if (pl.y > H + 8) { killPlayer(); return; }

  updateRobot();
  spawners();
  st.drums.forEach(updateDrum); st.sparks.forEach(updateSpark); st.crates.forEach(updateCrate); st.springs.forEach(updateSpring);
  for (const k of ['drums', 'sparks', 'crates', 'springs']) st[k] = st[k].filter(e => !e.dead);

  for (const m of st.mallets) {
    if (m.taken || pl.state === 'climb') continue;
    if (Math.abs(pl.x - m.x) < 7 && pl.y - 13 < m.y && pl.y > m.y - 12) { m.taken = true; pl.mallet = 600; sfx.pickup(); }
  }

  if (st.bolts) {
    for (const b of st.bolts) {
      if (!b.alive) continue;
      const on = pl.state === 'walk' && Math.abs(pl.y - b.y1) < 2 && pl.x + FOOT > b.x1 + 1 && pl.x - FOOT < b.x2 - 1;
      if (on) b.touched = true;
      else if (b.touched) {
        b.alive = false; st.boltsLeft--;
        st.fx.push({ type: 'pop', x: (b.x1 + b.x2) / 2, y: b.y1 + 3, t: 0 });
        addScore(100, (b.x1 + b.x2) / 2, b.y1 - 12); sfx.bolt();
        if (st.boltsLeft <= 0) { stageClear(); return; }
      }
    }
  }

  checkHits(); if (game.state !== 'play') return;
  if (st.goal && pl.state === 'walk' && pl.ground === st.goal) { stageClear(); return; }

  if (st.frame % 1800 === 0 && diff.d < MAX_D) { st.bump = (st.bump || 0) + 1; diff = makeDiff(st.bump); }
  if (st.frame % 120 === 0) {
    st.bonus = Math.max(0, st.bonus - 100);
    if (st.bonus === 0) { killPlayer(); return; }
    if (st.bonus <= 1000) sfx.warn();
  }
  musicTick();
  updateFx();
}

function step() {
  if (game.state !== 'paused') game.t++;
  switch (game.state) {
    case 'title':
      if (jumpBuf > 0 || startQueued) { jumpBuf = 0; startQueued = false; newGame(); }
      break;
    case 'opening':
      updateOpening();
      if (game.state === 'opening' && game.t > 30 && (jumpBuf > 0 || startQueued)) { jumpBuf = 0; startQueued = false; startIntro(); }
      break;
    case 'intro':
      if (game.t >= 130 || (game.t > 40 && (jumpBuf > 0 || startQueued))) { jumpBuf = 0; startQueued = false; game.state = 'play'; game.t = 0; }
      break;
    case 'play':
      if (st.freeze > 0) { st.freeze--; break; }      // tiny hit-pause after a smash
      updatePlay(); break;
    case 'dying':
      pl.deadT++; st.frame++; updateFx();
      if (pl.deadT === 32) sfx.die();
      if (pl.deadT >= 160) {
        game.lives--;
        if (game.lives <= 0) { game.state = 'over'; game.t = 0; game.newHi = game.score > game.hiAtStart; saveHi(); sfx.over(); }
        else startIntro();
      }
      break;
    case 'clear': {
      st.frame++; updateFx();
      const r = st.robot;
      if (r.falling && !r.landed) {
        r.vy += 0.12; r.y += r.vy;
        if (r.y >= 248) { r.y = 248; r.landed = true; sfx.stomp(); st.shake = 14; }
      }
      if (st.type !== 'bolts') updateEscape();
      if (game.t >= (st.type === 'bolts' ? 220 : 205)) {
        game.stageIdx++;
        if (game.stageIdx >= stageList(game.level).length) { game.level++; game.stageIdx = 0; }
        startIntro();
      }
      break;
    }
    case 'over':
      if (game.t > 600 || (game.t > 60 && (jumpBuf > 0 || startQueued))) { jumpBuf = 0; startQueued = false; game.state = 'title'; game.t = 0; }
      break;
  }
  startQueued = false;
  if (jumpBuf > 0) jumpBuf--;
  if (st && st.shake > 0 && game.state !== 'paused') st.shake--;
  let latchEnded = false;
  for (const k in latch) if (latch[k] > 0 && --latch[k] === 0) latchEnded = true;
  if (latchEnded) dpadVis();
}

/* Remember where everything was before this step, so frames between steps can be drawn
   part-way (smooth motion on 90/120Hz phone screens). */
function movers() {
  if (!st) return [];
  const a = [pl, st.robot].concat(st.drums, st.sparks, st.crates, st.springs);
  return a;
}
function snapPrev() {
  for (const e of movers()) { e.px = e.x; e.py = e.y; }
  if (st && st.lifts) for (const l of st.lifts) l.py = l.y1;
}

/* ---------------- drawing ---------------- */
function drawStars(t) {
  for (const [x, y, tw] of STARS) R(x, y, 1, 1, tw && ((t >> 5) + x) % 3 === 0 ? '#3a4680' : '#1a2148');
}
function girderTile(x, y, w) {
  R(x, y, w, 1, C.girderHi); R(x, y + 1, w, 1, C.girder); R(x, y + 6, w, 1, C.girder);
  for (let i = 0; i < w; i++) { const k = (x + i) % 8, row = k < 4 ? 2 + k : 9 - k; R(x + i, y + row, 1, 1, C.girder); }
}
function drawGirder(p) {
  for (let x = p.x1; x < p.x2; x += 8) {
    const w = Math.min(8, p.x2 - x);
    girderTile(x, Math.round(surf(p, x + w / 2)), w);
  }
}
function drawBelt(p, t) {
  const y = Math.round(p.y1), x1 = p.x1, w = p.x2 - p.x1;
  R(x1, y, w, 7, '#1d2342'); R(x1, y, w, 1, '#c9d2e3'); R(x1, y + 6, w, 1, '#c9d2e3');
  const off = (((t * p.belt) % 8) + 8) % 8;
  for (let x = x1 + off - 8; x < p.x2; x += 8) { const xx = Math.round(x); if (xx >= x1 + 4 && xx + 3 <= p.x2 - 4) R(xx, y + 2, 3, 3, C.girder); }
  for (const rx of [x1, p.x2 - 4]) { R(rx, y + 1, 4, 5, '#e6e9f0'); R(rx + 1 + ((t >> 3) & 1), y + 3, 1, 1, '#1d2342'); }
}
function drawBolt(p) {
  const y = Math.round(p.y1);

const DT = 1000 / 60;
function drawSmooth(alpha) {
  const live = game.state === 'play' || game.state === 'dying' || game.state === 'clear' || game.state === 'opening';
  if (!live || !st) { draw(); return; }
  const ents = movers(), saved = [];
  for (const e of ents) {
    saved.push(e.x, e.y);
    if (e.px != null && Math.abs(e.x - e.px) < 12 && Math.abs(e.y - e.py) < 12) {
      e.x = e.px + (e.x - e.px) * alpha; e.y = e.py + (e.y - e.py) * alpha;
    }
  }
  const lifts = st.lifts || [], ly = lifts.map(l => l.y1);
  for (const l of lifts) if (l.py != null && Math.abs(l.y1 - l.py) < 12) { l.y1 = l.y2 = l.py + (l.y1 - l.py) * alpha; }
  draw();
  ents.forEach((e, i) => { e.x = saved[i * 2]; e.y = saved[i * 2 + 1]; });
  lifts.forEach((l, i) => { l.y1 = l.y2 = ly[i]; });
}
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= DT) { snapPrev(); step(); acc -= DT; }
  drawSmooth(acc / DT);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// handy for debugging from the browser console
window.__boltz = {
  game, keys, get st() { return st; }, get pl() { return pl; },
  tick(n) { for (let i = 0; i < (n || 1); i++) step(); draw(); },
  press(k, on) { if (k === 'jump' && on && !keys.jump) jumpBuf = 8; keys[k] = on; },
  start() { startQueued = true; }
};
})();
</script>
